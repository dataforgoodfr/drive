# Construit et pousse les images de Drive que Data For Good déploie :
# ghcr.io/dataforgoodfr/drive-backend et drive-frontend.
#
# La branche `d4g` est l'amont (suitenumerique/drive) plus les correctifs que
# Data For Good propose en amont sans les avoir encore — aujourd'hui le type
# d'élément « lien » (d4g-community-manager DCM2-190). Elle se rebase sur
# chaque version amont, et disparaît quand l'amont a tout repris.
#
# Packages publics, comme d4g-fizzy : une image privée dans l'organisation est
# un ErrImagePull 401 côté cluster.
name: d4g-images

on:
  push:
    branches: [d4g]
  workflow_dispatch:

env:
  DOCKER_USER: 1001:127

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: drive-backend
            file: ./Dockerfile
            target: backend-production
          - image: drive-frontend
            file: ./src/frontend/Dockerfile
            target: frontend-production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `sha-<court>` est l'étiquette que d4g-gitops épingle.
          tags: |
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # Le cluster est en amd64 seulement.
          platforms: linux/amd64
          build-args: DOCKER_USER=${{ env.DOCKER_USER }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
